node_types:
  System:
    display_name: 系统
    description: 架构图中的系统/服务节点（审定架构组件）
    category: 服务
    color: blue
    icon: server
    allows_relations:
      - DEPENDS_ON
      - DOCUMENTS
      - REFERENCES
      - RELATED
      - USES
      - HAS_VERSION
  Entity:
    display_name: 实体
    description: 知识库实体节点（wiki/entities 中的 .md 文件）
    category: 服务
    color: green
    icon: file-text
    allows_relations:
      - BELONGS_TO
      - REFERENCES
      - DOCUMENTS
  Document:
    display_name: 文档
    description: 技术文档节点（raw/precleaned 中的 .md 文件）
    category: 文档
    color: amber
    icon: book
    allows_relations:
      - DOCUMENTS
      - REFERENCES
      - MENTIONS
      - APPLIES_TO
      - BELONGS_TO
      - HAS_SYMPTOM
  KnowledgeArticle:
    display_name: 知识文章
    description: 受管知识文章的个体类型
    category: 文档
    color: amber
    icon: book
    subClassOf: Document
    data_properties:
      title:
        required: true
  Concept:
    display_name: 概念
    description: 抽象概念、方法论、术语定义
    category: 概念
    color: purple
    icon: lightbulb
    allows_relations:
      - REFERENCES
      - DOCUMENTS
      - MENTIONS
  BusinessDomain:
    display_name: 知识域
    dictionary_id: bd061091-c542-43a5-9fdb-fdb319f0b92f
    description: 业务域（ops, ref, concept, product, meta, arch）
    category: 域
    color: slate
    icon: layers
    data_properties:
      id: {}
      name: { required: true }
    allows_relations:
      - BELONGS_TO
  Subdomain:
    display_name: 子域
    dictionary_id: bd061091-c542-43a5-9fdb-fdb319f0b92f
    description: 子域（如 deploy, cluster）
    category: 域
    color: slate
    icon: layers
    data_properties:
      id: {}
      name: { required: true }
    allows_relations:
      - BELONGS_TO
  Product:
    display_name: 产品
    description: 产品（AnyShare / AnyBackup / AnyRobot）
    category: 产品
    color: indigo
    icon: package
    data_properties:
      id: {}
      name: { required: true }
    allows_relations:
      - HAS_VERSION
      - APPLIES_TO
  ProductVersion:
    display_name: 产品版本
    dictionary_id: 72a641da-dd78-45ca-9c19-eaed00a6d24c
    description: 产品版本（如 7.0.6.8）
    category: 版本
    color: indigo
    icon: tag
    data_properties:
      id: {}
      name: { required: true }
    allows_relations:
      - USES
      - APPLIES_TO
      - HAS_VERSION
  Team:
    display_name: 团队
    description: 团队/组织
    category: 其他
    color: gray
    icon: users
    allows_relations:
      - REFERENCES
  Module:
    display_name: 产品模块
    dictionary_id: b8edcd53-13ad-4a9c-97f0-9386fac854d5
    description: 知识库 module 分组节点
    category: 服务
    color: teal
    icon: package
    allows_relations:
      - BELONGS_TO
      - REFERENCES
      - DOCUMENTS
      - ASSOCIATED_WITH
    data_properties:
      id: {}
      name: { required: true }
      system: { required: true }
      subdomain: { required: true }
      parent_id: {}
      since: {}
      until: {}
      products: {}
      description: {}
  Plate:
    display_name: 知识板块（聚合视图）
    description: 知识板块聚合节点（product × article_type / doc-type / module 维度），权限边界实体承载桩
    category: 板块
    color: emerald
    icon: grid
    allows_relations:
      - BELONGS_TO
      - ASSOCIATED_WITH
      - APPLIES_TO
      - REFERENCES
      - INDEXES
  FaqCard:
    display_name: 问题卡
    description: 问题卡（WP-212 终验实例类——问题/答案结构化知识条目）
    category: 概念
    color: purple
    icon: lightbulb
    data_properties:
      question:
        required: true
      answer:
        required: true
      weight: {}
relation_types:
  DEPENDS_ON:
    assertion_policies:
      - source_kind: typed_wikilink
        producer: extract_graph.entity_typed_wikilink
        decision_mode: reviewed
        required_evidence:
          - source_revision
          - source_coordinate
          - target_identity
        formal_consumers:
          - topology
          - relation_search
          - impact_analysis
      - source_kind: entity-wikilink
        producer: extract_graph.entity_typed_wikilink
        decision_mode: reviewed
        required_evidence:
          - source_revision
          - source_coordinate
          - target_identity
        formal_consumers:
          - topology
          - relation_search
          - impact_analysis
    description: A 运行时依赖 B（A→B 表示 A 依赖 B 才能运行）
    direction: A 依赖 B
    weight_default: 1
    weight_range:
      - 0.8
      - 1
    versionable: true
    source_types:
      - System
      - Entity
      - Module
    target_types:
      - System
    label_cn: 依赖
    semantic_role: architecture_skeleton
    candidate_enabled: true
    fact_encoding: typed_wikilink
    projected: true
    impact_propagation: reverse
    legacy_policy: keep
    confidence_prior: 0.8
    confidence_floor: 0.4
    aliases:
      - 依赖
  DOCUMENTS:
    assertion_policies:
      # WP-170（Master 裁决B落位，2026-11-13）：正文实体匹配→机器候选，必经人审（reviewed）——
      # MENTIONS/REFERENCES 均 candidate_enabled=false 禁机器量产，DOCUMENTS 为唯一开放且语义贴合（文档说明组件）的落位
      - source_kind: document-body
        producer: article-relation-candidates
        decision_mode: reviewed
        required_evidence:
          - evidence_text
        formal_consumers:
          - pending_review
          - review_actions
      - source_kind: article_association
        producer: article-association-service.approved_association
        decision_mode: inherit_source_approval
        required_evidence:
          - source_revision
          - decision_id
          - target_identity
        formal_consumers:
          - article_search
          - relation_search
      - source_kind: article-association-override
        producer: article-association-service.approved_association
        decision_mode: inherit_source_approval
        required_evidence:
          - source_revision
          - decision_id
          - target_identity
        formal_consumers:
          - article_search
          - relation_search
    description: 文档描述或属于某个组件/模块
    direction: 文档 → 组件
    weight_default: 0.9
    weight_range:
      - 0.7
      - 1
    versionable: false
    source_types:
      - Document
      - Concept
    target_types:
      - System
      - Entity
      - Concept
      - Module
    label_cn: 文档说明
    semantic_role: article_attachment
    candidate_enabled: true
    fact_encoding: article_association
    projected: true
    impact_propagation: none
    legacy_policy: migrate
    confidence_prior: 0.8
    confidence_floor: 0.4
    graph_database: true
  REFERENCES:
    assertion_policies:
      - source_kind: wikilink
        producer: extract_graph.plain_wikilink
        decision_mode: inherit_source_approval
        required_evidence:
          - source_revision
          - source_coordinate
        formal_consumers:
          - relation_search
          - topology
      - source_kind: document-body
        producer: extract_graph.plain_wikilink
        decision_mode: inherit_source_approval
        required_evidence:
          - target_identity
        formal_consumers:
          - relation_search
          - topology
      - source_kind: multi-source-inference
        producer: extract_graph.multi-source-inference
        decision_mode: reviewed
        required_evidence:
          - target_identity
        formal_consumers:
          - relation_search
          - topology
      - source_kind: team-placeholder
        producer: extract_graph.team-placeholder
        decision_mode: derived_only
        required_evidence: []
        formal_consumers: []
    description: 实体间语义引用关系
    direction: 双向语义关联
    weight_default: 0.4
    weight_range:
      - 0.3
      - 0.7
    versionable: false
    source_types:
      - System
      - Entity
      - Document
      - Concept
      - Module
    target_types:
      - System
      - Entity
      - Document
      - Concept
      - Module
    label_cn: 引用
    semantic_role: weak_semantic
    candidate_enabled: false
    fact_encoding: wikilink
    projected: true
    impact_propagation: none
    legacy_policy: keep
    confidence_prior: 0.7
    confidence_floor: 0.35
    graph_database: true
  MENTIONS:
    assertion_policies:
      - source_kind: derived
        producer: extract_graph.derived_mentions
        decision_mode: derived_only
        required_evidence:
          - source_revision
          - match_coordinate
        formal_consumers: []
    description: 文档正文中提及了某个概念
    direction: 文档 → 概念
    weight_default: 0.2
    weight_range:
      - 0.1
      - 0.5
    versionable: false
    source_types:
