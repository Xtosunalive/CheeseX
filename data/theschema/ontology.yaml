node_types:
  System:
    description: 架构图中的系统/服务节点（审定架构组件）
    category: 服务
    color: blue
    icon: server
    allows_relations:
      - DEPENDS_ON
      - DOCUMENTS
      - REFERENCES
      - RELATED
      - USES
      - HAS_VERSION
  Entity:
    description: 知识库实体节点（wiki/entities 中的 .md 文件）
    category: 服务
    color: green
    icon: file-text
    allows_relations:
      - BELONGS_TO
      - REFERENCES
      - DOCUMENTS
  Document:
    description: 技术文档节点（raw/precleaned 中的 .md 文件）
    category: 文档
    color: amber
    icon: book
    allows_relations:
      - DOCUMENTS
      - REFERENCES
      - MENTIONS
      - APPLIES_TO
      - BELONGS_TO
      - HAS_SYMPTOM
  KnowledgeArticle:
    description: 受管知识文章的个体类型
    category: 文档
    subClassOf: Document
    data_properties:
      title:
        required: true
  Concept:
    description: 抽象概念、方法论、术语定义
    category: 概念
    color: purple
    icon: lightbulb
    allows_relations:
      - REFERENCES
      - DOCUMENTS
      - MENTIONS
  BusinessDomain:
    description: 业务域（ops, ref, concept, product, meta, arch）
    category: 域
    color: slate
    icon: layers
    allows_relations:
      - BELONGS_TO
  Subdomain:
    description: 子域（如 deploy, cluster）
    category: 域
    color: slate
    icon: layers
    allows_relations:
      - BELONGS_TO
  Product:
    description: 产品（AnyShare / AnyBackup / AnyRobot）
    category: 产品
    color: indigo
    icon: package
    allows_relations:
      - HAS_VERSION
      - APPLIES_TO
  ProductVersion:
    description: 产品版本（如 7.0.6.8）
    category: 版本
    color: indigo
    icon: tag
    allows_relations:
      - USES
      - APPLIES_TO
      - HAS_VERSION
  Team:
    description: 团队/组织
    category: 其他
    color: gray
    icon: users
    allows_relations:
      - REFERENCES
  Module:
    description: 知识库 module 分组节点
    category: 服务
    color: teal
    icon: package
    allows_relations:
      - BELONGS_TO
      - REFERENCES
      - DOCUMENTS
      - ASSOCIATED_WITH
  Plate:
    description: 知识板块聚合节点（product × article_type / doc-type / module 维度），权限边界实体承载桩
    category: 板块
    color: emerald
    icon: grid
    allows_relations:
      - BELONGS_TO
      - ASSOCIATED_WITH
      - APPLIES_TO
      - REFERENCES
      - INDEXES
  business_object:
    description: 对象字典业务对象卡（治理图节点——对象本体批 ADR-012 D1；词表锚定
      contracts/object-dictionary.json object_kind）
    category: 对象
    color: cyan
    icon: database
    allows_relations:
      - derivation
      - usage
      - reference
      - co_editing
      - containment
  config_object:
    description: 对象字典配置对象卡（治理图节点——对象本体批 ADR-012 D1；词表锚定
      contracts/object-dictionary.json object_kind）
    category: 对象
    color: teal
    icon: settings
    allows_relations:
      - derivation
      - usage
      - reference
      - co_editing
      - containment
  runtime_view:
    description: 对象字典运行视图卡（治理图节点——「未收录值」观察哨；当前无关系类型以其为端点词表）
    category: 对象
    color: slate
    icon: eye
    allows_relations: []
relation_types:
  DEPENDS_ON:
    assertion_policies:
      - source_kind: typed_wikilink
        producer: extract_graph.entity_typed_wikilink
        decision_mode: reviewed
        required_evidence:
          - source_revision
          - source_coordinate
          - target_identity
        formal_consumers:
          - topology
          - relation_search
          - impact_analysis
      - source_kind: entity-wikilink
        producer: extract_graph.entity_typed_wikilink
        decision_mode: reviewed
        required_evidence:
          - source_revision
          - source_coordinate
          - target_identity
        formal_consumers:
          - topology
          - relation_search
          - impact_analysis
    description: A 运行时依赖 B（A→B 表示 A 依赖 B 才能运行）
    direction: A 依赖 B
    weight_default: 1
    weight_range:
      - 0.8
      - 1
    versionable: true
    source_types:
      - System
      - Entity
      - Module
    target_types:
      - System
    label_cn: 依赖
    semantic_role: architecture_skeleton
    candidate_enabled: true
    fact_encoding: typed_wikilink
    projected: true
    impact_propagation: reverse
    legacy_policy: keep
    confidence_prior: 0.8
    confidence_floor: 0.4
    aliases:
      - 依赖
  DOCUMENTS:
    assertion_policies:
      # WP-170（Master 裁决B落位，2026-11-13）：正文实体匹配→机器候选，必经人审（reviewed）——
      # MENTIONS/REFERENCES 均 candidate_enabled=false 禁机器量产，DOCUMENTS 为唯一开放且语义贴合（文档说明组件）的落位
      - source_kind: document-body
        producer: article-relation-candidates
        decision_mode: reviewed
        required_evidence:
          - evidence_text
        formal_consumers:
          - pending_review
          - review_actions
      - source_kind: article_association
        producer: article-association-service.approved_association
        decision_mode: inherit_source_approval
        required_evidence:
          - source_revision
          - decision_id
          - target_identity
        formal_consumers:
          - article_search
          - relation_search
      - source_kind: article-association-override
        producer: article-association-service.approved_association
        decision_mode: inherit_source_approval
        required_evidence:
          - source_revision
          - decision_id
          - target_identity
        formal_consumers:
          - article_search
          - relation_search
    description: 文档描述或属于某个组件/模块
    direction: 文档 → 组件
    weight_default: 0.9
    weight_range:
      - 0.7
      - 1
    versionable: false
    source_types:
      - Document
      - Concept
    target_types:
      - System
      - Entity
      - Concept
      - Module
    label_cn: 文档说明
    semantic_role: article_attachment
    candidate_enabled: true
    fact_encoding: article_association
    projected: true
    impact_propagation: none
    legacy_policy: migrate
    confidence_prior: 0.8
    confidence_floor: 0.4
    graph_database: true
  REFERENCES:
    assertion_policies:
      - source_kind: wikilink
        producer: extract_graph.plain_wikilink
        decision_mode: inherit_source_approval
        required_evidence:
          - source_revision
          - source_coordinate
        formal_consumers:
          - relation_search
          - topology
      - source_kind: document-body
        producer: extract_graph.plain_wikilink
        decision_mode: inherit_source_approval
        required_evidence:
          - target_identity
        formal_consumers:
          - relation_search
          - topology
      - source_kind: multi-source-inference
        producer: extract_graph.multi-source-inference
        decision_mode: reviewed
        required_evidence:
          - target_identity
        formal_consumers:
          - relation_search
          - topology
      - source_kind: team-placeholder
        producer: extract_graph.team-placeholder
        decision_mode: derived_only
        required_evidence: []
        formal_consumers: []
    description: 实体间语义引用关系
    direction: 双向语义关联
    weight_default: 0.4
    weight_range:
      - 0.3
      - 0.7
    versionable: false
    source_types:
      - System
      - Entity
      - Document
      - Concept
      - Module
    target_types:
      - System
      - Entity
      - Document
      - Concept
      - Module
    label_cn: 引用
    semantic_role: weak_semantic
    candidate_enabled: false
    fact_encoding: wikilink
    projected: true
    impact_propagation: none
    legacy_policy: keep
    confidence_prior: 0.7
    confidence_floor: 0.35
    graph_database: true
  MENTIONS:
    assertion_policies:
      - source_kind: derived
        producer: extract_graph.derived_mentions
        decision_mode: derived_only
        required_evidence:
          - source_revision
          - match_coordinate
        formal_consumers: []
    description: 文档正文中提及了某个概念
    direction: 文档 → 概念
    weight_default: 0.2
    weight_range:
      - 0.1
      - 0.5
    versionable: false
    source_types:
      - Document
    target_types:
      - Concept
      - System
    label_cn: 提及
    semantic_role: weak_semantic
    candidate_enabled: false
    fact_encoding: derived
    projected: false
    impact_propagation: none
    legacy_policy: keep
    confidence_prior: 0.6
    confidence_floor: 0.3
    graph_database: true
  BELONGS_TO:
    assertion_policies:
      - source_kind: category_path
        producer: category-path-projection.classification
        decision_mode: deterministic
        required_evidence:
          - source_revision
          - category_path
        formal_consumers:
          - navigation
          - article_search
      - source_kind: auto-discovered
        producer: extract_graph.auto-discovered
        decision_mode: deterministic
        required_evidence:
          - target_identity
        formal_consumers:
          - navigation
          - article_search
      - source_kind: plate-aggregation
        producer: extract_graph.plate-aggregation
        decision_mode: deterministic
        required_evidence:
          - target_identity
        formal_consumers:
          - navigation
          - article_search
    description: 从属关系（子→父），如概念属于子域、文档归属板块
    direction: 子 → 父
    weight_default: 0.8
    weight_range:
      - 0.7
      - 1
    versionable: false
    source_types:
      - Subdomain
      - Document
      - Entity
      - Concept
      - Module
    target_types:
      - BusinessDomain
      - Subdomain
      - Plate
    label_cn: 归属
    semantic_role: category_navigation
    candidate_enabled: false
    fact_encoding: category_path
    projected: true
    impact_propagation: none
    legacy_policy: keep
    graph_database: true
  APPLIES_TO:
    assertion_policies:
      - source_kind: article_association
        producer: article-association-service.approved_association
        decision_mode: inherit_source_approval
        required_evidence:
          - source_revision
          - decision_id
          - target_identity
        formal_consumers:
          - article_search
          - version_filter
      - source_kind: article-association-override
        producer: article-association-service.approved_association
        decision_mode: inherit_source_approval
        required_evidence:
          - source_revision
          - decision_id
          - target_identity
        formal_consumers:
          - article_search
          - version_filter
      - source_kind: plate-version-aggregation
        producer: extract_graph.plate-version-aggregation
        decision_mode: deterministic
        required_evidence:
          - target_identity
        formal_consumers:
          - version_filter
      - source_kind: document-frontmatter
        producer: extract_graph.document-frontmatter
        decision_mode: inherit_source_approval
        required_evidence:
          - target_identity
        formal_consumers:
          - article_search
          - version_filter
    description: 文档/板块适用于某个产品/版本
    direction: 文档/板块 → 产品/版本
    weight_default: 0.9
    weight_range:
      - 0.7
      - 1
    versionable: false
    source_types:
      - Document
      - Plate
    target_types:
      - Product
      - ProductVersion
    label_cn: 适用于
    semantic_role: article_attachment
    candidate_enabled: true
    fact_encoding: article_association
    projected: true
    impact_propagation: none
    legacy_policy: migrate
    confidence_prior: 0.7
    confidence_floor: 0.35
    graph_database: true
  HAS_VERSION:
    assertion_policies:
      - source_kind: version_registry
        producer: version-registry.has_version
        decision_mode: deterministic
        required_evidence:
          - product_key
          - version_key
        formal_consumers:
          - version_navigation
      - source_kind: version-inference
        producer: extract_graph.version-inference
        decision_mode: deterministic
        required_evidence:
          - target_identity
        formal_consumers:
          - version_navigation
    description: 产品拥有某个版本
    direction: 产品 → 版本
    weight_default: 1
    weight_range:
      - 1
      - 1
    versionable: false
    source_types:
      - Product
    target_types:
      - ProductVersion
    label_cn: 拥有版本
    semantic_role: category_navigation
    candidate_enabled: false
    fact_encoding: version_registry
    projected: true
    impact_propagation: none
    legacy_policy: keep
    graph_database: true
  HAS_SYMPTOM:
    assertion_policies:
      - source_kind: structured_property
        producer: structured-property.symptom_fact
        decision_mode: inherit_source_approval
        required_evidence:
          - source_revision
          - symptom_property
        formal_consumers:
          - symptom_search
    description: 排错文档描述了某个故障现象（Concept 节点承载现象关键词）
    direction: 文档 → 现象
    weight_default: 0.7
    weight_range:
      - 0.5
      - 0.9
    versionable: false
    source_types:
      - Document
    target_types:
      - Concept
    label_cn: 现象
    semantic_role: article_attachment
    candidate_enabled: false
    fact_encoding: structured_property
    projected: true
    impact_propagation: none
    legacy_policy: migrate
    graph_database: true
  USES:
    assertion_policies:
      - source_kind: legacy_graph
        producer: legacy.uses_emission
        decision_mode: forbidden
        required_evidence: []
        formal_consumers: []
    description: 版本使用了某个组件
    direction: 版本 → 组件
    weight_default: 0.9
    weight_range:
      - 0.7
      - 1
    versionable: false
    source_types:
      - ProductVersion
    target_types:
      - System
    label_cn: 使用
    semantic_role: historical_compat
    candidate_enabled: false
    fact_encoding: none
    projected: false
    impact_propagation: none
    legacy_policy: delete
    graph_database: true
  RELATED:
    assertion_policies:
      - source_kind: typed_wikilink
        producer: extract_graph.entity_typed_wikilink
        decision_mode: reviewed
        required_evidence:
          - source_revision
          - source_coordinate
          - target_identity
        formal_consumers:
          - relation_search
          - topology
      - source_kind: entity-wikilink
        producer: extract_graph.entity_typed_wikilink
        decision_mode: reviewed
        required_evidence:
          - source_revision
          - source_coordinate
          - target_identity
        formal_consumers:
          - relation_search
          - topology
    description: 语义相关关系，需人工审核确认具体含义
    direction: 双向
    weight_default: 0.3
    weight_range:
      - 0.1
      - 0.5
    versionable: false
    source_types:
      - System
      - Entity
      - Document
      - Concept
    target_types:
      - System
      - Entity
      - Document
      - Concept
    requires_review: true
    label_cn: 相关
    semantic_role: weak_semantic
    candidate_enabled: true
    fact_encoding: typed_wikilink
    projected: true
    impact_propagation: none
    legacy_policy: keep
    aliases:
      - relates_to
      - related
      - 关联
    graph_database: true
  BACKS_UP:
    assertion_policies:
      - source_kind: typed_wikilink
        producer: extract_graph.entity_typed_wikilink
        decision_mode: reviewed
        required_evidence:
          - source_revision
          - source_coordinate
          - target_identity
        formal_consumers:
          - topology
          - relation_search
          - impact_analysis
      - source_kind: entity-wikilink
        producer: extract_graph.entity_typed_wikilink
        decision_mode: reviewed
        required_evidence:
          - source_revision
          - source_coordinate
          - target_identity
        formal_consumers:
          - topology
          - relation_search
          - impact_analysis
    description: A 备份到 B
    direction: A → B
    weight_default: 0.7
    weight_range:
      - 0.5
      - 0.9
    versionable: true
    source_types:
      - System
      - Entity
    target_types:
      - System
      - Entity
    is_legacy: true
    label_cn: 备份于
    semantic_role: architecture_skeleton
    candidate_enabled: true
    fact_encoding: typed_wikilink
    projected: true
    impact_propagation: reverse
    legacy_policy: migrate
    aliases:
      - 备份
  STORES_IN:
    assertion_policies:
      - source_kind: typed_wikilink
        producer: extract_graph.entity_typed_wikilink
        decision_mode: reviewed
        required_evidence:
          - source_revision
          - source_coordinate
          - target_identity
        formal_consumers:
          - topology
          - relation_search
          - impact_analysis
      - source_kind: entity-wikilink
        producer: extract_graph.entity_typed_wikilink
        decision_mode: reviewed
        required_evidence:
          - source_revision
          - source_coordinate
          - target_identity
        formal_consumers:
          - topology
          - relation_search
          - impact_analysis
    description: A 的数据存储于 B
    direction: A → B
    weight_default: 0.8
    weight_range:
      - 0.6
      - 1
    versionable: true
    source_types:
      - System
      - Entity
    target_types:
      - System
      - Entity
    is_legacy: true
    label_cn: 存储于
    semantic_role: architecture_skeleton
    candidate_enabled: true
    fact_encoding: typed_wikilink
    projected: true
    impact_propagation: reverse
    legacy_policy: migrate
    aliases:
      - 存储
  CONNECTS_TO:
    assertion_policies:
      - source_kind: typed_wikilink
        producer: extract_graph.entity_typed_wikilink
        decision_mode: reviewed
        required_evidence:
          - source_revision
          - source_coordinate
          - target_identity
        formal_consumers:
          - topology
          - relation_search
          - impact_analysis
      - source_kind: entity-wikilink
        producer: extract_graph.entity_typed_wikilink
        decision_mode: reviewed
        required_evidence:
          - source_revision
          - source_coordinate
          - target_identity
        formal_consumers:
          - topology
          - relation_search
          - impact_analysis
    description: A 连接到 B（网络连接）
    direction: 双向
    weight_default: 0.7
    weight_range:
      - 0.5
      - 0.9
    versionable: true
    source_types:
      - System
      - Entity
    target_types:
      - System
      - Entity
    is_legacy: true
    label_cn: 连接到
    semantic_role: architecture_skeleton
    candidate_enabled: true
    fact_encoding: typed_wikilink
    projected: true
    impact_propagation: forward_stop
    legacy_policy: migrate
    aliases:
      - connects
      - 连接
  INDEXES:
    assertion_policies:
      - source_kind: typed_wikilink
        producer: extract_graph.entity_typed_wikilink
        decision_mode: reviewed
        required_evidence:
          - source_revision
          - source_coordinate
          - target_identity
        formal_consumers:
          - topology
          - relation_search
          - impact_analysis
      - source_kind: entity-wikilink
        producer: extract_graph.entity_typed_wikilink
        decision_mode: reviewed
        required_evidence:
          - source_revision
          - source_coordinate
          - target_identity
        formal_consumers:
          - topology
          - relation_search
          - impact_analysis
    description: A 对 B 建立索引
    direction: A → B
    weight_default: 0.6
    weight_range:
      - 0.4
      - 0.8
    versionable: true
    source_types:
      - System
      - Entity
    target_types:
      - System
      - Entity
    is_legacy: true
    label_cn: 索引于
    semantic_role: architecture_skeleton
    candidate_enabled: true
    fact_encoding: typed_wikilink
    projected: true
    impact_propagation: reverse
    legacy_policy: migrate
    aliases:
      - 索引
  ENCRYPTS:
    assertion_policies:
      - source_kind: typed_wikilink
        producer: extract_graph.entity_typed_wikilink
        decision_mode: reviewed
        required_evidence:
          - source_revision
          - source_coordinate
          - target_identity
        formal_consumers:
          - topology
          - relation_search
          - impact_analysis
      - source_kind: entity-wikilink
        producer: extract_graph.entity_typed_wikilink
        decision_mode: reviewed
        required_evidence:
          - source_revision
          - source_coordinate
          - target_identity
        formal_consumers:
          - topology
          - relation_search
          - impact_analysis
    description: A 加密 B 的数据
    direction: A → B
    weight_default: 0.6
    weight_range:
      - 0.4
      - 0.8
    versionable: true
    source_types:
      - System
      - Entity
    target_types:
      - System
      - Entity
    is_legacy: true
    label_cn: 加密
    semantic_role: architecture_skeleton
    candidate_enabled: true
    fact_encoding: typed_wikilink
    projected: true
    impact_propagation: reverse
    legacy_policy: migrate
    aliases:
      - 加密
  ASSOCIATED_WITH:
    assertion_policies:
      - source_kind: derived
        producer: plate-product-projection.association
        decision_mode: deterministic
        required_evidence:
          - source_revision
          - plate_coordinate
        formal_consumers:
          - navigation
      - source_kind: plate-product-link
        producer: extract_graph.plate-product-link
        decision_mode: deterministic
        required_evidence:
          - target_identity
        formal_consumers:
          - navigation
      - source_kind: plate-system-aggregation
        producer: extract_graph.plate-system-aggregation
        decision_mode: deterministic
        required_evidence:
          - target_identity
        formal_consumers:
          - navigation
    description: 板块与产品/组件的关联（Plate→Product/System/Module），驾驶舱导航展开链
    direction: 板块 → 实体
    weight_default: 0.85
    weight_range:
      - 0.7
      - 1
    versionable: false
    source_types:
      - Plate
    target_types:
      - Product
      - System
      - Module
    label_cn: 关联板块
    semantic_role: category_navigation
    candidate_enabled: false
    fact_encoding: derived
    projected: true
    impact_propagation: none
    legacy_policy: migrate
    graph_database: true
  derivation:
    description: 治理语义边——本对象由目标对象派生（或反向）
    direction: 派生方 → 被派生方
    label_cn: 派生
    semantic_role: governance_semantics
    candidate_enabled: false
    fact_encoding: governance_assertion
    projected: true
    source_types:
      - business_object
      - config_object
    target_types:
      - business_object
      - config_object
    versionable: false
    impact_propagation: none
    legacy_policy: keep
    weight_default: 0.5
