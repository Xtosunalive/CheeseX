inference_rules:
  - name: transitive_dependency
    description: 如果 A DEPENDS_ON B 且 B DEPENDS_ON C，则 A 间接依赖 C
    pattern: A -[DEPENDS_ON]-> B -[DEPENDS_ON]-> C
    output: A -[DEPENDS_ON]-> C (inferred)
  - name: document_covers_related
    description: 如果 D DOCUMENTS A 且 A REFERENCES B，则 D 也关联 B
    pattern: D -[DOCUMENTS]-> A -[REFERENCES]-> B
    output: D -[REFERENCES]-> B (inferred)
constraints:
  - id: no_untyped_relation
    description: 不允许未定义的关系类型
    check: relation_type in ontology.relation_types
    severity: error
  - id: source_target_valid
    description: 关系的 source/target 类型必须匹配定义
    check: source_label in relation.source_types and target_label in
      relation.target_types
    severity: warning
  - id: no_orphan_entity
    description: Entity 节点必须有至少一条关系边（否则无法归类）
    check: degree(node) > 0
    severity: warning
    scope: category == '服务'
  - id: versionable_has_range
    description: 标记为 versionable 的关系必须有 since/until 字段
    check: relation.versionable implies 'since' in properties
    severity: warning
confidence_suggestion:
  cooccurrence_cap: 10
  note: 初始值入决策卡标记待校准（SPEC-027 C1）；全局建议参数，第 3 步校准修订
  band_high: 0.85
  band_medium: 0.5
  band_low: 0.3

# WP-048 Wave 1（ADR-014 §3.2/§6.1）：动作契约——W1-A 批 16 个动作。
# http_route 与 OpenAPI 契约操作对账（action-registry 快照构建期执法）；executor 指向登记执行器
# （server/shared/action-execution-factory.cjs 注册表，执行器实现＝既有 handler 逻辑原样迁入）；
# required_roles 是已迁移端点角色绑定的唯一来源（与静态 ROUTE_ROLES 互斥对账）；
# input_schema 只是指向契约 requestBody 的文档性指针——传输校验在 http-boundary，工厂不重复校验；
# effects 声明后置核验（revision_present＝结果须携带非空 revision，仅对结果形状已实测的动作声明）；
# lifecycle_status 缺省 approved（ADR-014 §3.1），仅 approved 进入活消费面。
