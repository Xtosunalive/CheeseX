# fields.yaml — frontmatter 字段数据字典 v2（ADR-008 D2；WP-195 类属主重构）
# 采 OpenBKN 设计（Master 2026-11-19 裁定）：属性归属于类，不归属于字段池。
#   身份＝(类, name)，类内唯一；跨类同名是两个独立属性（title 在实体类与文章类是两个属性，恰共享英文键名）。
#   display＝该类下此属性的中文绑定声明（必填，≤40 字符）——schema 层显式承诺，不再靠中文名暗示语义。
#     三处冲突已按 Master 裁定「冲突时取 OpenBKN」落名：architecture-node-id→架构组件 ID（标识惯例）、
#     arch_component→是否架构组件（名词性布尔）、entity status→生命周期状态（类限定 XX状态惯例）。
#   description＝属性级业务规则唯一书写处（BKN 定位：声明用于理解与展示，校验另做——执法归合规引擎）。
#   value_domain.source＝值域引用（free 或 enums.yaml 命名段；resolve 配方随属性，被引用段删除保护归门禁）。
# 派生面族（禁手改，全部从本文件再生）：
#   entity-frontmatter-schema.md（project-frontmatter-schema.mjs）
#   shared/field-labels.mjs 与 src/lib/generated/field-view.ts（gen:field-view）
#   contracts/entity-readiness-rules.json fields/article.fields 键段（gen-readiness-required/readiness-required——表单形状手写）
# 对账门禁：check:fields-registry（server 消费键 ⊆ 类属性集，(类,name) 口径）；check:fields-dictionary（类内唯一/display≤40/引用闭合）。
# keys 段（BKN Keys 小节对应物）：primary＝系统铸造身份锚（创建后不可改）；display＝显示名键；incremental＝增量更新键。
schema_version: 2
last_updated: 2026-11-19
keys:
  entity:
    primary: architecture-node-id
    display: title
    incremental: updated
  article:
    primary: article_id
    display: title
classes:
  entity:
    properties:
      - name: title
        display: 实体名称
        type: string
        required: 是
        layer: 内容属性
        description: 文档标题；实体侧对应语义架构 SA label。
        value_domain:
          source: free
          note: 自由标题文本（PR-156 刀四：显式声明 free——字典页与门禁不再显示为空值域）
      - name: aliases
        display: 别名
        type: list
        required: 否
        layer: 内容属性
        description: 实体别名（Obsidian frontmatter aliases）；修复写通道锚定 F17 声明（别名写通道，
          诊断侧不含——三 view 语义差为历史裁决，见 field-policy）。v2 库存补录：v1 漏声明而 server 有通道。
        value_domain:
          source: free
          note: 自由别名列表；写通道资格由 field-rule-declarations F17 在场性背书（fail-closed）
      - name: tags
        display: 标签
        type: list
        required: 否
        layer: 内容属性
        description: 检索标签（行内数组/块列表/标量三种写法均可，解析口径同 G1'）。
        value_domain:
          source: tags
          resolve:
            op: tags_union
          normalize:
            aliases: tag_aliases
          note: 正式标签=各分组扁平并集-disabled_tags；别名经 tag_aliases 归一
      - name: category-path
        display: 知识域目录
        type: string
        required: 建议
        layer: 内容属性
        description: 标准文档分类路径（PR-046 契约，validate-article.py 单一语义）；文章侧必填、实体侧建议
          （v1 单值 required=是 按描述拆分落值）。
        value_domain:
          source: free
          composite:
            - source: domains
              resolve:
                op: keys
            - source: subdomains
              resolve:
                op: ids
              scoped_by: previous
            - resolve:
                op: free_slug
          note: domain:subdomain:topic 三段式——domain/subdomain 为 enums 闭合枚举，topic 自由小写 ASCII
            slug；禁历史排错口径 troubleshoot
      - name: impact_level
        display: 影响面等级
        type: string
        required: 否
        layer: 内容属性
        description: 检索索引影响面权重辅助字段。
        value_domain:
          source: free
      - name: is_core
        display: 核心标记
        type: bool
        required: 否
        layer: 内容属性
        description: 是否核心实体（影响面权重）。
        value_domain:
          source: free
      - name: architecture-node-id
        display: 架构组件 ID
        type: string
        required: 是
        layer: 业务属性
        description: 全局唯一组件 ID（不透明串：任意字符、任意语言、任意大小写皆可写；ADR-016 §二／SPEC-046 I2 禁止消费方对身份做
          split／正则解析）。必须有值——空白填充不算填写。创建后不可修改；下划线写法 architecture_node_id 工具链同源可读。
          display 取 OpenBKN 标识惯例（类名＋ID；Master 2026-11-19「冲突时取 OpenBKN」裁定，原 UI 名「架构组件身份」）。
        value_domain:
          source: free
          note: 全 vault 不可重复；对应 SA id。不透明串——不限字符形状（校验只判有无值，不按形状裁决）；创建后不可修改
        aliases:
          - architecture_node_id
      - name: arch_layer
        display: 架构分层
        type: enum
        required: 建议
        layer: 业务属性
        description: 组件所处架构层；文章 frontmatter 同名字段的使用计入词表画像。（Master 2026-10-29
          裁定：文章侧非必填——架构归类值走继承式取值，不逐篇手写；实体侧执法暂维持现状，继承机制另案）
        value_domain:
          source: layers
          resolve:
            op: ids
            filter: entity_usable
          normalize:
            aliases: architecture_projection.layer_aliases
          note: 正式值=layers[].id 且 entity_layer!=false（plate 排除）；别名经 layer_aliases 归一
      - name: arch_category
        display: 实体类别
        type: enum
        required: 建议
        layer: 业务属性
        description: 业务分类（终端/服务/存储/基础设施/安全等）。（Master 2026-10-29
          裁定：文章侧非必填——架构归类值走继承式取值，不逐篇手写；实体侧执法暂维持现状，继承机制另案）
        value_domain:
          source: arch_categories
          resolve:
            op: matrix_union_fallback
          normalize:
            aliases: architecture_projection.category_aliases
          note: 派生视图——subdomain_policies 并集优先（ADR-006）；别名经 category_aliases 归一
      - name: arch_subdomain
        display: 子域
        type: enum
        required: 建议
        layer: 业务属性
        description: 组件所属技术子域。
        value_domain:
          source: subdomains
          resolve:
            op: ids
          normalize:
            aliases: architecture_projection.subdomain_aliases
          note: 子域词条 id（ADR-008 D1 对象形态）；别名经 subdomain_aliases 归一
      - name: arch_since
        display: 组件有效期起点
        type: string
        required: 建议
        layer: 业务属性
        description: 此组件从哪个版本开始存在（如 7.0.0）。
        value_domain:
          source: free
          note: 由人定义，不自动推断
      - name: arch_until
        display: 组件有效期终点
        type: string
        required: 建议
        layer: 业务属性
        description: 此组件在哪个版本后废弃。
        value_domain:
          source: free
          note: 默认空串=当前版本生效，由人更新
      - name: arch_version_overrides
        display: 版本属性覆盖
        type: list
        required: 否
        layer: 业务属性
        description: 版本间属性差异列表。
        value_domain:
          source: free
      - name: module
        display: 产品模块
        type: list
        required: 建议
        layer: 业务属性
        description: 所属模块匹配名列表；文章侧必填、实体侧建议（v1 单值 required=是 按描述拆分落值）。
        value_domain:
          source: modules
          resolve:
            op: keys
          normalize:
            wikilink_strip: true
          note: 正式值=modules 键；wikilink 引用剥离（[[主模块]]→主模块）
      - name: arch_component
        display: 是否架构组件
        type: bool
        required: 是
        layer: 业务属性
        description: true=此 entity 是架构组件。display 取名词性布尔命名（OpenBKN 无动作句式先例；
          Master 2026-11-19「冲突时取 OpenBKN」裁定，原 UI 名「激活为架构组件」）。
        value_domain:
          source: free
      - name: arch_status
        display: 架构状态
        type: string
        required: 否
        layer: 业务属性
        description: 组件架构生命周期状态（业务属性表成员）。
        value_domain:
          source: free
      - name: status
        display: 生命周期状态
        type: enum
        required: 是
        layer: 管理属性
        description: 实体 Obsidian 页面状态（有效/已归档/制定中）。display 取 OpenBKN 类限定惯例（XX状态；
          Master 2026-11-19「冲突时取 OpenBKN」裁定，原 UI 名「状态」）；受影响消费点随批改引页面词。
        value_domain:
          source: free
          note: Obsidian 页面状态三值：有效/已归档/制定中（与文章侧文档生命周期 status 分立）
      - name: date
        display: 创建日期
        type: date
        required: 是
        layer: 管理属性
        description: 创建日期。
        value_domain:
          source: free
          note: YYYY-MM-DD
      - name: updated
        display: 最后更新日期
        type: date
        required: 建议
        layer: 管理属性
        description: 最后更新日期。
        value_domain:
          source: free
          note: YYYY-MM-DD；SA 顶层 updatedAt 取所有组件最大值
      - name: review-cycle
        display: 审查周期
        type: enum
        required: 建议
        layer: 管理属性
        description: 审查调度周期（时效过滤消费）。
        value_domain:
          source: lifecycle
          segment: lifecycle.review_cycle
          resolve:
            op: values
          note: 30d/90d/180d/365d/never
  article:
    properties:
      - name: title
        display: 标题
        type: string
        required: 是
        layer: 内容属性
        description: 文档标题（文章类属性——与实体类 title 为两个独立属性，恰共享英文键名）。
        value_domain:
          source: free
          note: 自由标题文本（PR-156 刀四：显式声明 free——字典页与门禁不再显示为空值域）
      - name: article_id
        display: 文章标识
        type: string
        required: 是
        layer: 管理属性
        description: 文章唯一标识（修复写门接受键）。v2 库存补录：v1 漏声明而契约/写门有此键。
        value_domain:
          source: free
          note: 全 vault 不可重复；系统铸造语义同实体类 architecture-node-id
      - name: tags
        display: 标签
        type: list
        required: 否
        layer: 内容属性
        description: 检索标签（行内数组/块列表/标量三种写法均可，解析口径同 G1'）。
        value_domain:
          source: tags
          resolve:
            op: tags_union
          normalize:
            aliases: tag_aliases
          note: 正式标签=各分组扁平并集-disabled_tags；别名经 tag_aliases 归一
      - name: category-path
        display: 知识域目录
        type: string
        required: 是
        layer: 内容属性
        description: 标准文档分类路径（PR-046 契约，validate-article.py 单一语义）；文章侧必填。
        value_domain:
          source: free
          composite:
            - source: domains
              resolve:
                op: keys
            - source: subdomains
              resolve:
                op: ids
              scoped_by: previous
            - resolve:
                op: free_slug
          note: domain:subdomain:topic 三段式——domain/subdomain 为 enums 闭合枚举，topic 自由小写 ASCII
            slug；禁历史排错口径 troubleshoot
      - name: article_type
        display: 知识文章类型
        type: enum
        required: 是
        layer: 内容属性
        description: 标准文章类型（排错指南/常见问题/方案设计等 9 值）。
        value_domain:
          source: article_types
          resolve:
            op: values
      - name: doc-type
        display: 文档类型
        type: enum
        required: 是
        layer: 内容属性
        description: 文档形态类型（用户手册/部署指南等 8 值）；下划线写法为兼容写法。
        value_domain:
          source: doc_types
          resolve:
            op: values
        aliases:
          - doc_type
      - name: validation_status
        display: 机器校验戳
        type: enum
        required: 否
        layer: 管理属性
        description: 最近一次机器校验结果的持久戳（SPEC-030
          机③——三机中唯一落文件者，证据随文件走）。值域＝passed/warnings/failed 三值，由统一校验客户端
          validate-article --stamp 整体重盖（article-validator-lib 单源）；值域属校验器语义不入 enums
          词表（词表走写单门供页面管理，校验器固有三值不属该面）。
        value_domain:
          source: free
          note: 校验章机制自有值集（passed/failed 由 validation stamp 系统写，非人选——PR-156 刀四注记豁免）
      - name: validation_override
        display: 校验豁免标记
        type: bool
        required: 否
        layer: 管理属性
        description: 机器校验 failed 的人工显式豁免（SPEC-030 机③——独立布尔不合成枚举值，保住「豁免对应哪次失败」的对应关系）；true
          时 promote/confirm 两道闸门放行，决策留痕 decisions.jsonl。
        value_domain:
          source: free
      - name: arch_layer
        display: 架构分层
        type: enum
        required: 建议
        layer: 业务属性
        description: 组件所处架构层（文章类属性）；文章 frontmatter 同名字段的使用计入词表画像。（Master 2026-10-29
          裁定：文章侧非必填——架构归类值走继承式取值，不逐篇手写）
        value_domain:
          source: layers
          resolve:
            op: ids
            filter: entity_usable
          normalize:
            aliases: architecture_projection.layer_aliases
          note: 正式值=layers[].id 且 entity_layer!=false（plate 排除）；别名经 layer_aliases 归一
      - name: arch_category
        display: 业务分类
        type: enum
        required: 建议
        layer: 业务属性
        description: 业务分类（终端/服务/存储/基础设施/安全等）（文章类属性——与实体类「实体类别」为同名独立属性）。
        value_domain:
          source: arch_categories
          resolve:
            op: matrix_union_fallback
          normalize:
            aliases: architecture_projection.category_aliases
          note: 派生视图——subdomain_policies 并集优先（ADR-006）；别名经 category_aliases 归一
      - name: arch_subdomain
        display: 子域
        type: enum
        required: 建议
        layer: 业务属性
        description: 组件所属技术子域。
        value_domain:
          source: subdomains
          resolve:
            op: ids
          normalize:
            aliases: architecture_projection.subdomain_aliases
          note: 子域词条 id（ADR-008 D1 对象形态）；别名经 subdomain_aliases 归一
      - name: module
        display: 产品模块
        type: list
        required: 是
        layer: 业务属性
        description: 所属模块匹配名列表（文章类属性——与实体类同名独立属性）。
        value_domain:
          source: modules
          resolve:
            op: keys
          normalize:
            wikilink_strip: true
          note: 正式值=modules 键；wikilink 引用剥离（[[主模块]]→主模块）
      - name: product
        display: 产品
        type: enum
        required: 是
        layer: 业务属性
        description: 文章所属产品。
        value_domain:
          source: architecture_projection
          resolve:
            op: product_closure
          note: A03 闭合集=architecture_projection.product+product_aliases 键；versions.yaml
            reserved_products 可引用
      - name: version
        display: 产品版本
        type: enum
        required: 是
        layer: 业务属性
        description: 文章针对的产品版本。
        value_domain:
          source: versions
          resolve:
            op: version_registry
          note: versions.yaml 产品版本注册表（G1+G5 唯一权威源）
      - name: status
        display: 文档生命周期状态
        type: enum
        required: 否
        layer: 管理属性
        description: 文章文档生命周期（灰度/在线/退役/已驳回）；新建缺省灰度。与实体类 status（生命周期状态）为同名独立属性。
        value_domain:
          source: lifecycle
          segment: lifecycle.status
          resolve:
            op: values
          default:
            from: lifecycle.default_status
            fallback: first
          note: 默认值=lifecycle.default_status（缺省回落首项）
      - name: body
        display: 正文
        type: string
        required: 否
        layer: 内容属性
        description: 文章正文（内容属性，非 frontmatter 键——正文另有通道；v2 库存补录：UI 标签层有此键而
          schema 未声明。声明于此仅为类属性清点完整，不参与 frontmatter 写门）。
        value_domain:
          source: free
          note: 内容通道；ARTICLE_CONTENT_FIELDS 语义由 field-policy 承载（写门排除 body）
