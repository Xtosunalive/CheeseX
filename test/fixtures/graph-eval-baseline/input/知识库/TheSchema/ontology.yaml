  # WP-048 W1-B 批（ADR-014 §八 #1/2/3/5/6/10/11/13/18/44/48/49）：文章/异常/评审族 12 个动作。
  # approval.transition 载荷敏感角色升级（operation=publish→publish 角色）以 payload_role_overrides
  # 声明式承载——角色绑定唯一来源仍是动作定义（原 route-roles PAYLOAD_ROLE_RULES 机制随本批退役）。
  # articles.upload 声明 success_status: 201（原 handler 先例）。
  anomalies.reconcile:
